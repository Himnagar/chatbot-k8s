apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: chatbot

spec:

  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:

    metadata:
      labels:
        app: mysql

    spec:

      nodeSelector:
        app-node: "true"

      containers:

        - name: mysql

          image: mysql:8.0

          ports:

            - containerPort: 3306

          env:

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:

                secretKeyRef:
                  name: chatbot-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:

                configMapKeyRef:
                  name: chatbot-config
                  key: DB_NAME

            - name: MYSQL_USER
              valueFrom:

                secretKeyRef:
                  name: chatbot-secret
                  key: DB_USER

            - name: MYSQL_PASSWORD
              valueFrom:

                secretKeyRef:
                  name: chatbot-secret
                  key: DB_PASSWORD

          volumeMounts:

            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:

        - name: mysql-storage

          persistentVolumeClaim:
            claimName: mysql-pvc
