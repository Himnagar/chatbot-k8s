apiVersion: apps/v1
kind: Deployment

metadata:
  name: chatbot-backend
  namespace: chatbot

spec:

  replicas: 2

  selector:
    matchLabels:
      app: chatbot-backend

  template:

    metadata:
      labels:
        app: chatbot-backend

    spec:

      nodeSelector:
        app-node: "true"

      containers:

        - name: backend

          image: chatbot-backend:1.0

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 3000

          env:

            - name: DB_HOST
              valueFrom:

                configMapKeyRef:
                  name: chatbot-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:

                configMapKeyRef:
                  name: chatbot-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:

                configMapKeyRef:
                  name: chatbot-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:

                secretKeyRef:
                  name: chatbot-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:

                secretKeyRef:
                  name: chatbot-secret
                  key: DB_PASSWORD
